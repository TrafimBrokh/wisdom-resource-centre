name: Format source remotely
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          include-hidden-files: true
          retention-days: 3
          path: |
            src/
            e2e/
            .github/workflows/
            .prettierrc.json
            package.json
            tsconfig.json
            vite.config.ts
            playwright.config.ts
            eslint.config.js
            index.html
            README.md
